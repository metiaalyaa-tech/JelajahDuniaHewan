return `<div class="cd" style="padding:14px 18px"><h2>🗺️ Peta Petualangan</h2><p style="color:var(--mu);margin:4px 0 0">Ikuti jalan kuning dan kumpulkan bintang!</p></div><div class="wm"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100" fill="#7CD35C"/><path d="M0 0H100V16C70 26 40 8 0 20Z" fill="#4FA85B"/><path d="M62 100V74C80 68 90 80 100 74V100Z" fill="#F0A24A"/><path d="M0 88C25 82 45 96 100 88V100H0Z" fill="#4DB6E2"/><path d="${P}" fill="none" stroke="#F0A24A" stroke-width="36" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="${P}" fill="none" stroke="#FFE27A" stroke-width="24" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${[['🌳',8,30],['🌲',88,52],['🌴',10,60],['🌵',86,82],['🦒',84,28],['🐪',88,68],['🐠',18,94],['🐬',76,95]].map(d=>`<span class="dc" style="left:${d[1]}%;top:${d[2]}%">${d[0]}</span>`).join('')}${N.map((n,i)=>`<button class="nd${L[i]?' lk':''}${i==cu?' cur':''}" style="left:${n[3]}%;top:${n[4]}%" onclick="op('${n[0]}',${L[i]?1:0})" aria-label="${n[2]}"><span class="nc">${L[i]?'🔒':n[1]}</span><span class="nl">${n[2]}</span><span class="ns">${stars(g(n[0]))}</span></button>`).join('')}</div><div class="ft"><button class="b g" onclick="go('m',5)">← Kembali ke Materi</button><button class="b g" onclick="go('act')">🎮 Aktivitas Tambahan</button><button class="b" onclick="go('result')">Lihat Hasil 🏆</button></div>`}
const SH2=[['🌊','Perairan'],['🌳','Hutan'],['🌾','Sabana'],['🏜️','Gurun'],['❄️','Kutub']],HC=['#8FD3F4','#8ED98A','#E3EE9A','#F7D8A0','#DDF1FB'],DC=[['🌊','🪸','🐚'],['🌳','🌴','🍃'],['🌾','🌿','☀️'],['🌵','🏜️','☀️'],['❄️','🧊','⛄']];
function sim(){return `<div class="mb"><div class="av">🐻</div><div class="bub">Pilih hewan dan habitatnya, lalu lihat apakah ia bisa bertahan 5 hari! Pasangan cocok yang ditemukan: <b>${SM.f.length}/6</b> ⭐</div></div><h4>1. Pilih hewan</h4><div class="tiles">${SA.map((a,i)=>`<button class="tile${i==SM.a?' on':''}${SM.f.includes(i)?' done':''}" onclick="SM.a=${i};go('sim')"><b>${a[0]}</b>${a[1]}</button>`).join('')}</div><h4>2. Pilih habitat</h4><div class="tiles">${SH2.map((h,i)=>`<button class="tile${i==SM.h?' on':''}" style="background:${HC[i]}" onclick="SM.h=${i};go('sim')"><b>${h[0]}</b>${h[1]}</button>`).join('')}</div><div class="sce" id="sc" style="background:${SB[SM.h]}"><div class="dy" id="dy">${'<i></i>'.repeat(5)}</div><div class="md" id="md">🙂</div>${DC[SM.h].map((e,i)=>`<span class="dc" style="left:${10+i*36}%;bottom:${54+i*20}px">${e}</span>`).join('')}<div class="gr"></div><div class="an">${SA[SM.a][0]}</div></div>${[['🍎','Makanan'],['💧','Air & napas'],['🛡️','Aman & nyaman']].map((x,i)=>`<div class="mrow"><span class="ic">${x[0]}</span><span class="lb">${x[1]}</span><div class="pb"><i id="m${i}" style="width:70%"></i></div><b id="p${i}">70%</b></div>`).join('')}<div class="mb" style="margin-top:14px"><div class="av">🐻</div><div class="bub" id="sr">Tekan tombol hijau untuk memulai simulasi.</div></div><button class="b w" onclick="srun()">▶ Mulai Simulasi</button>`}
function srun(){clearInterval(SH);const a=SA[SM.a],ok=a[2]==SM.h,sc=$('#sc'),col=v=>v>60?'#6CC51F':v>35?'#FFB020':'#F0583F';let d=0,m=[70,70,70];sc.classList.add('run');$('#sr').textContent='Hari ke-1...';
const up=()=>{m.forEach((v,i)=>{const e=$('#m'+i);e.style.width=v+'%';e.style.setProperty('--c',col(v));$('#p'+i).textContent=v+'%'});const av=m.reduce((x,y)=>x+y)/3;$('#md').textContent=av>60?'😄':av>35?'😟':'😵';document.querySelectorAll('#dy i').forEach((x,i)=>x.classList.toggle('on',i<d))};up();
SH=setInterval(()=>{d++;m=m.map(v=>Math.max(0,Math.min(100,Math.round(v+(ok?6:-14)+(Math.random()*6-3)))));up();if(d<5){$('#sr').textContent='Hari ke-'+(d+1)+'...';return}clearInterval(SH);sc.classList.remove('run');if(ok){if(!SM.f.includes(SM.a))SM.f.push(SM.a);$('#sr').textContent='🎉 '+a[1]+' bertahan di '+H[SM.h]+'! Karena '+a[1]+' punya '+a[3]+'.';burst(sc);sfx(2)}else{$('#sr').textContent='😟 '+a[1]+' sulit bertahan di '+H[SM.h]+'. Di sana '+SX[SM.h]+'. Ciri '+a[1]+' ('+a[3]+') lebih cocok di '+H[a[2]]+'.';sfx(0)}},900)}
var GR;
function game(){return `<div class="cd"><h2>🕹️ Sortir Hewan Cepat</h2><div class="hud"><span class="pill">⭐ <b id="gs">0</b></span><span class="pill" id="gl">❤️❤️❤️</span><span class="pill">🚀 Level <b id="glv">1</b></span><span class="pill">🏆 ${GB}</span></div><div id="gf"><span class="cl" style="top:8%;animation-duration:34s">☁️</span><span class="cl" style="top:26%;animation-duration:48s;animation-delay:-18s">☁️</span><div class="grs"></div><div id="ga"></div><div class="ov" id="gov"><div class="bub c" style="flex:none;max-width:340px">Hewan turun dengan parasut! Sentuh habitat yang cocok sebelum hewan menyentuh rumput. Bisa juga tekan angka 1–5.</div><button class="b" onclick="gstart()">▶ Main!</button></div></div><div class="lanes">${LN.map((n,i)=>`<button style="background:${LC[i]}" onclick="gp(${i})"><i>${i+1}</i><b>${LE[i]}</b>${n}</button>`).join('')}</div></div>`}
function gstart(){cancelAnimationFrame(GR);G={on:1,s:0,l:3,k:0,lv:1,sp:70,y:-90,t:performance.now(),c:null};$('#gov').style.display='none';gu();gsp();GR=requestAnimationFrame(gl)}
function gsp(){G.c=GA[Math.random()*GA.length|0];G.y=-90;const a=$('#ga');a.innerHTML='<i>'+G.c[0]+'</i>';a.style.left=(16+Math.random()*68)+'%'}
function gu(){$('#gs').textContent=G.s;$('#gl').textContent='❤️'.repeat(G.l)+'🖤'.repeat(3-G.l);$('#glv').textContent=G.lv}
function gl(t){if(!G||!G.on||!$('#gf'))return;G.y+=G.sp*Math.min(.05,(t-G.t)/1000);G.t=t;$('#ga').style.top=G.y+'px';if(G.y>250)glose();if(G&&G.on)GR=requestAnimationFrame(gl)}
function gfx(t,c){const f=document.createElement('span');f.className='fl';f.textContent=t;f.style.color=c;f.style.left=$('#ga').style.left;f.style.top=Math.max(20,G.y)+'px';$('#gf').appendChild(f);setTimeout(()=>f.remove(),900)}
function lf(i,c){const b=document.querySelectorAll('.lanes button')[i];if(!b)return;b.classList.add(c);setTimeout(()=>b.classList.remove(c),350)}
function glose(i){G.l--;sfx(0);gfx('Ups!','#F0583F');if(i!=null)lf(i,'no');gu();if(G.l<=0)gend();else gsp()}
function gp(i){if(!G||!G.on)return;if(G.c[1]==i){G.s+=10;G.k++;G.lv=1+(G.k/5|0);G.sp=70+G.lv*12;burst($('#ga'));sfx(1);gfx('+10','#2FA84F');lf(i,'ok');gu();gsp()}else glose(i)}
function gend(){G.on=0;GB=Math.max(GB,G.s);const st=G.s>=100?3:G.s>=50?2:1,o=$('#gov');o.style.display='flex';o.innerHTML=`<div class="cd" style="margin:0;text-align:center"><h3>Permainan selesai!</h3><div class="st" style="font-size:40px">${sn(st)}</div><p style="font-weight:800;margin:6px 0 12px">Skor kamu ${G.s} • Level ${G.lv}</p><button class="b" onclick="gstart()">🔄 Main Lagi</button></div>`;sfx(2)}
if(!window.gk){window.gk=1;document.addEventListener('keydown',e=>{if(cur=='game'&&G&&G.on&&/^[1-5]$/.test(e.key))gp(+e.key-1)})}
</script></body></html>
